# Source of truth for JLCPCB design rules.
#
# Values are seeded from the previously hand-maintained JLCPCB.kicad_dru (which
# tracked https://jlcpcb.com/capabilities/pcb-capabilities). Concrete .kicad_dru
# files are generated from this file by tools/generate_dru.py — do not hand-edit
# the generated output.

[fab]
name = "JLCPCB"
prefix = "JLCPCB"
capabilities_url = "https://jlcpcb.com/capabilities/pcb-capabilities"
default_variant = "4L-1oz"   # gets the plainly-named JLCPCB/JLCPCB.kicad_dru

[flags]
avoid_kelvin_test = true       # JLCPCB adds an expensive 4-wire Kelvin test for tiny holes
avoid_small_via_extra_cost = true # holes below 0.3mm cost extra unless via diameter is at least 0.45mm
allow_blind_buried = false     # standard process: through-hole vias only
enforce_plated_slot_ratio = true # plated slot length must be at least twice its width
emit_implied_clearance = true  # emit the not-explicitly-stated catch-all clearances
emit_bga = true                # emit the BGA fan-out clearance rule
merge_trace_layers = true      # JLCPCB publishes one width/spacing limit for all copper layers
emit_same_net_trace_spacing = true # emit the disabled KiCad-9.0.8 workaround block

# Values that do not change between variants.
[constants]
drill_hole_max     = "6.3mm"
via_annular        = "0.05mm"
small_via_hole     = "0.3mm"
small_via_diameter = "0.45mm"
pth_hole_min       = "0.2mm"
pth_hole_max       = "6.3mm"
npth_hole_min      = "0.5mm"
castellated_min    = "0.6mm"
pth_annular        = "0.15mm"
npth_annular       = "0.45mm"
kelvin_annular     = "0.125mm"
plated_slot_min    = "0.5mm"
nonplated_slot_min = "1.0mm"
via_hole_diff      = "0.2mm"
via_pad_hole_diff  = "0.45mm"
pad_nohole_diff    = "0.15mm"
pad_hole_diff      = "0.45mm"
implied_diff       = "0.127mm"
implied_same_net   = "0.254mm"
via_to_trace       = "0.2mm"
pth_to_trace       = "0.28mm"
pth_to_trace_inner = "0.3mm"
npth_to_trace      = "0.2mm"
npth_to_copper     = "0.2mm"
pad_to_trace       = "0.2mm"
bga_to_trace       = "0.1mm"
same_net_trace_spacing = "0.25mm"
text_thickness     = "0.15mm"
text_height        = "1mm"
silk_clearance     = "0.15mm"
edge_routed        = "0.3mm"

[[variant]]
id = "2L-1oz"
label = "1-2 layer, 1oz copper"
layers = 2
[variant.over]
drill_hole_min      = "0.3mm"
via_hole            = "0.3mm"
pth_annular         = "0.18mm"
trace_width_outer   = "0.1mm"
trace_spacing_outer = "0.1mm"

[[variant]]
id = "4L-1oz"
label = "4 layer, 1oz outer / 0.5oz inner"
layers = 4
[variant.over]
drill_hole_min      = "0.2mm"
via_hole            = "0.2mm"
trace_width_outer   = "0.09mm"
trace_spacing_outer = "0.09mm"

[[variant]]
id = "4L-2oz"
label = "4 layer, 2oz copper"
layers = 4
[variant.over]
drill_hole_min      = "0.2mm"
via_hole            = "0.2mm"
pth_annular         = "0.254mm"
trace_width_outer   = "0.15mm"
trace_spacing_outer = "0.15mm"

[[variant]]
id = "6L-1oz"
label = "6 layer, 1oz outer / 0.5oz inner"
layers = 6
[variant.over]
drill_hole_min      = "0.2mm"
via_hole            = "0.2mm"
trace_width_outer   = "0.09mm"
trace_spacing_outer = "0.09mm"

[[diffpair]]
name = "50R"
diff = false
track_width = "0.2mm"

[[diffpair]]
name = "60R_Diff"
diff = true
track_width = "0.3mm"
gap = "0.15mm"

[[diffpair]]
name = "90R_Diff"
diff = true
track_width = "0.2mm"
gap = "0.13mm"

[[diffpair]]
name = "100R_Diff"
diff = true
track_width = "0.2mm"
gap = "0.2mm"

[[diffpair]]
name = "120R_Diff"
diff = true
track_width = "0.15mm"
gap = "0.2mm"
